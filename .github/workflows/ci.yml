name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m compileall -q app data domain engine models odds providers services utils main.py config.py
      - run: python -m pytest -q --cov=app --cov=data --cov=domain --cov=engine --cov=models --cov=odds --cov=providers --cov=services --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
