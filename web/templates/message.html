{% extends "base.html" %}
{% block title %}{{ title }}: True Prob AI{% endblock %}
{% block content %}
<section class="auth">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <p class="cta-row">
    <a class="btn ghost" href="/">Home</a>

</section>
{% endblock %}
